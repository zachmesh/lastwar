# This checkout is a standalone GitHub clone, not a folder inside the
# reflection root, and it carries no REPO.yaml graph edge. The reflection
# team-record linter therefore resolves reflection.* paths and the person
# handle locally and reports them missing; they exist in ~/dtadpole/reflection
# and the roster is JSON-schema valid. Recorded as a declared exception in
# _records_/2026-11-22/team-operations/setup.md.
