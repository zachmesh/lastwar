record_owner: coordinator
# Owner gateway, outside the seat roster. The Steward is the owner's root DSH
# session. It relays owner instructions and approvals to the coordinator and
# receives needs-owner escalations. It is not a seat: it holds no write scope,
# takes no assignment and runs no loop schedule. The coordinator seat moved
# from this session to its own session at 2026-11-23T04:04Z.
steward:
  session_id: session-eb024f72-e661-4a77-9303-66af95dbcfd1
  title: '[Last War] Steward'
  role: owner-gateway
  principal: zhenc
coordination:
  review_interval_minutes: 15
  seat_review:
    cadence: one seat per daily review, rotating
    record: _seats_/coordinator/member-review.md
  report_channel: pull request on main, plus the action log
  authorization_ref: null
  allowed_operations:
    - read game state through the computer-use MCP and record observations
    - execute one bounded play unit at a time under the device token
    - maintain the task queue, its slots and its records
    - run the perception, research, retro and knowledge-improvement work of the seats
    - open pull requests for load-bearing changes and push records to the date branch
  resource_budget_ref: null
  execution:
    work_mode: continuous
    continuation_requirement: the coordinator's 15-minute schedule is the loop clock; every other seat is woken by a bounded assignment and replies with an artifact path
    coordinator_review_seconds: 900
    loop_schedule_id: schedule-53b1277f-4e75-4e35-ae7b-ce379f0b53b0
    loop_schedule_owner_session: session-4b4cb08d-fb77-419a-be34-14a72a3b73d1
    approved_model_ref: null
    cap_authority_ref: _conventions_/local-conventions/continuous-play-team.md
  reporting:
    owner_gateway: coordinator
    seats_report_to: coordinator
    peer_communication_policy_ref: _conventions_/local-conventions/continuous-play-team.md
  mechanical_backstop:
    session_id: null
    responsibilities_ref: null
    content_route: null
  stopping_policy_ref: _conventions_/local-conventions/continuous-play-team.md
capacity:
  normal_max_sessions: 8
  size_exception: null
self_improvement:
  responsible_seats:
    - coordinator
    - coach
  allocation_ref: _records_/retro/improvements.md
  concerns:
    - execution-effectiveness
    - discovery-comprehensiveness
    - learning-rate
    - tooling-and-automation
    - evidence-and-analysis-quality
people:
  - {handle: zhenc, role: owner}
oncall: zhenc
